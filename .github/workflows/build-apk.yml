name: Build Tyr Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android project files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tyrstudio --project-name tyr_studio .
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk[ =].*/compileSdk = 35/' android/app/build.gradle
            sed -i 's/targetSdk[ =].*/targetSdk = 35/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
