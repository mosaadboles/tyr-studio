name: Build Tyr Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android project files exist
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tyrstudio --project-name tyr_studio .
          fi
          sed -i '/^\s*gal\s*:/d' pubspec.yaml
          if [ -f "lib/main.dart" ]; then
            sed -i "/package:gal\/gal.dart/d" lib/main.dart
            python3 -c '
from pathlib import Path
p = Path("lib/main.dart")
txt = p.read_text(encoding="utf-8")
if "dart:io" not in txt:
    txt = "import '\''dart:io'\'';\n" + txt
import re
txt = re.sub(
    r"await\s+Gal\.putImageBytes\s*\((.*?)\)\s*;",
    r"await (() async { final dir = Directory('\''/storage/emulated/0/Download'\''); if (!await dir.exists()) { await dir.create(recursive: true); } final file = File('\''${dir.path}/tyr_studio_${DateTime.now().millisecondsSinceEpoch}.png'\''); await file.writeAsBytes(\1); })();",
    txt,
    flags=re.DOTALL,
)
p.write_text(txt, encoding="utf-8")
'
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk[ =].*/compileSdk = 35/' android/app/build.gradle
            sed -i 's/targetSdk[ =].*/targetSdk = 35/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyr-studio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
